version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

  api1:
    build: .
    env_file:
      - .env
    restart: unless-stopped

  api2:
    build: .
    env_file:
      - .env
    restart: unless-stopped

  api3:
    build: .
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker1
    env_file:
      - .env
    restart: unless-stopped
