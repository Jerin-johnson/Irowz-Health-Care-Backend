events {
    worker_connections 1024;
}

http {

  # Better performance settings
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Upstream backend containers
  upstream backend_pool {
    least_conn;
    server api1:3000;
    server api2:3000;
    server api3:3000;
  }

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name api.irowzcure.shop;

    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name api.irowzcure.shop;

    ssl_certificate /etc/letsencrypt/live/api.irowzcure.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.irowzcure.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Important for large payloads (video / uploads)
    client_max_body_size 50M;

    location / {

      proxy_pass http://backend_pool;

      # REQUIRED for WebSockets
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Forward real client info
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Prevent socket disconnect
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;

      # Avoid buffering WebSocket traffic
      proxy_buffering off;
    }

    # Optional health check route
    location /health {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
    }
  }
}
